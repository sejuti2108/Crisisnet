<!-- Real-Time Alert Toast Container & WebSocket Client -->
<div id="live-alert-toast-container" aria-live="polite" style="position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 380px; width: 100%; pointer-events: none; display: flex; flex-direction: column; gap: 10px;"></div>

<style>
  .live-alert-toast {
    pointer-events: auto;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    border-left: 5px solid #0077b6;
    padding: 14px 16px;
    animation: slideInRight 0.3s ease-out;
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-size: 0.9rem;
    color: #212529;
  }
  .live-alert-toast.critical, .live-alert-toast.urgent { border-left-color: #dc3545; background: #fffcfc; }
  .live-alert-toast.high { border-left-color: #fd7e14; }
  .live-alert-toast.medium { border-left-color: #ffc107; }
  @keyframes slideInRight {
    from { transform: translateX(110%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .live-alert-badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: white;
    background: #0077b6;
  }
  .live-alert-badge.critical, .live-alert-badge.urgent { background: #dc3545; }
  .live-alert-badge.high { background: #fd7e14; }
  .live-alert-badge.medium { background: #d39e00; }
</style>

<script>
(function initAlertWebSocket() {
  if (window.__crisisNetAlertWsInitialized) return;
  window.__crisisNetAlertWsInitialized = true;

  const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
  const wsUrl = protocol + window.location.host + "/ws/alerts/";

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function safeLevelClass(value) {
    const clean = String(value || "info").toLowerCase();
    return ["critical", "urgent", "high", "medium", "normal", "advisory", "low", "info"].includes(clean)
      ? clean
      : "info";
  }

  function connect() {
    const socket = new WebSocket(wsUrl);

    socket.onmessage = function(e) {
      try {
        const data = JSON.parse(e.data);
        if (data.event_type === "incident_update") {
          showIncidentToast(data);
        } else if (data.event_type === "operational_notice") {
          showNoticeToast(data);
        } else if (data.event_type === "weather_update") {
          showWeatherToast(data);
        }
        if (typeof window.onCrisisNetAlert === "function") {
          window.onCrisisNetAlert(data);
        }
      } catch (err) {
        console.error("Alert broadcast parse error:", err);
      }
    };

    socket.onclose = function() {
      setTimeout(connect, 4000);
    };
  }

  function createToastElement(html, levelClass) {
    const container = document.getElementById("live-alert-toast-container");
    if (!container) return;
    const toast = document.createElement("div");
    toast.className = "live-alert-toast " + levelClass;
    toast.innerHTML = html;
    container.appendChild(toast);

    setTimeout(function() {
      toast.style.opacity = "0";
      toast.style.transform = "translateX(50px)";
      setTimeout(function() { toast.remove(); }, 350);
    }, 9000);

    const closeBtn = toast.querySelector(".toast-close");
    if (closeBtn) {
      closeBtn.onclick = function() { toast.remove(); };
    }
  }

  function showIncidentToast(data) {
    const level = safeLevelClass(data.severity);
    const lat = Number(data.latitude);
    const lon = Number(data.longitude);
    const incidentUrl = data.id ? "/incidents/" + encodeURIComponent(data.id) + "/" : "#";
    const mapUrl = (!Number.isNaN(lat) && !Number.isNaN(lon))
      ? "/map/?lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon)
      : "/map/";

    const html = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span class="live-alert-badge ${level}">&#128680; Incident ${escapeHtml(data.action || "Update")}</span>
        <span style="font-size: 0.75rem; color: #888;">${escapeHtml(data.timestamp || "")} <button class="toast-close" style="background:none;border:none;cursor:pointer;font-weight:bold;margin-left:6px;font-size:1rem;color:#888;" aria-label="Dismiss">&times;</button></span>
      </div>
      <div style="font-weight: 700; color: #1f3864; margin-bottom: 4px;">${escapeHtml(data.title)}</div>
      <div style="font-size: 0.82rem; color: #555; margin-bottom: 6px;">
        &#128205; ${escapeHtml(data.location || "Emergency Zone")} &bull; <strong>${escapeHtml(data.severity_display || data.severity)}</strong> &bull; Status: ${escapeHtml(data.status_display || data.status)}
      </div>
      <div>
        <a href="${incidentUrl}" style="font-size: 0.8rem; color: #0077b6; text-decoration: none; font-weight: 600;">View Incident &rarr;</a>
        <a href="${mapUrl}" style="font-size: 0.8rem; color: #dc3545; text-decoration: none; font-weight: 600; margin-left: 12px;">Map View &rarr;</a>
      </div>
    `;
    createToastElement(html, level);
  }

  function showNoticeToast(data) {
    const priority = safeLevelClass(data.priority);
    const html = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span class="live-alert-badge ${priority}">&#128226; Operational Notice</span>
        <span style="font-size: 0.75rem; color: #888;">${escapeHtml(data.timestamp || "")} <button class="toast-close" style="background:none;border:none;cursor:pointer;font-weight:bold;margin-left:6px;font-size:1rem;color:#888;" aria-label="Dismiss">&times;</button></span>
      </div>
      <div style="font-weight: 700; color: #1f3864; margin-bottom: 4px;">${escapeHtml(data.title)}</div>
      <div style="font-size: 0.82rem; color: #444; margin-bottom: 6px; white-space: pre-line;">${escapeHtml(data.message)}</div>
      <div style="font-size: 0.75rem; color: #777;">
        Issued by: <strong>${escapeHtml(data.author || "HQ Command")}</strong> &bull; Priority: ${escapeHtml(data.priority_display || data.priority)}
      </div>
    `;
    createToastElement(html, priority);
  }

  function showWeatherToast(data) {
    const isReset = data.action === "reset";
    const level = isReset ? "info" : "high";
    const verb = isReset ? "Reset to Seasonal Baseline" : "Live Weather Override";
    const html = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span class="live-alert-badge ${level}">&#127782; ${verb}</span>
        <span style="font-size: 0.75rem; color: #888;">${escapeHtml(data.timestamp || "")} <button class="toast-close" style="background:none;border:none;cursor:pointer;font-weight:bold;margin-left:6px;font-size:1rem;color:#888;" aria-label="Dismiss">&times;</button></span>
      </div>
      <div style="font-weight: 700; color: #1f3864; margin-bottom: 4px;">Station: ${escapeHtml(data.station_name)}</div>
      <div style="font-size: 0.78rem; color: #555;">
        Updated by <strong>${escapeHtml(data.author || "HQ Command")}</strong> &bull;
        <a href="/map/" style="color: #0077b6; text-decoration: none; font-weight: 600;">View Map &rarr;</a>
      </div>
    `;
    createToastElement(html, level);
  }

  connect();
})();
</script>
